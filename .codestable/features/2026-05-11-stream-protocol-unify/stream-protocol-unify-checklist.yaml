feature: 2026-05-11-stream-protocol-unify
roadmap: j-gui-v1
roadmap_item: stream-protocol-unify
created: 2026-05-11
status: in-progress

steps:
  - id: step-1
    paradigm: micro-refactor
    description: "从 `src/lib/ipc.ts` 提取 Chat/Agent 流协议 normalize helper，先完成只搬不改行为的拆文件"
    exit: bunx tsc --noEmit 通过
    status: done
  - id: step-2
    paradigm: data-model
    description: "在 `packages/shared` 定型 canonical chat/agent request、stream payload 与 unsupported error 类型"
    exit: bunx tsc --noEmit 通过
    status: done
  - id: step-3
    paradigm: backend
    description: "Chat `send_message` 改为接收 request DTO，并真实消费 `sessionId/content/channelId/modelId/systemMessage`"
    exit: cargo test 通过
    status: done
  - id: step-4
    paradigm: frontend
    description: "Chat IPC + listeners + EventBus 统一为 `delta` 口径与 `chat:stream:*` namespaced 事件"
    exit: bun run test 通过
    status: done
  - id: step-5
    paradigm: backend
    description: "Agent CLI path / JAgent path / interrupt 响应统一到 `AgentStreamPayload` + `respond_agent_interrupt`"
    exit: cargo test 通过
    status: done
  - id: step-6
    paradigm: micro-refactor
    description: "提取 Rust 侧 Chat protocol resolver / request builder，让 `test_channel_input` 与 `send_message` 共用选路逻辑"
    exit: cargo test 通过
    status: done
  - id: step-7
    paradigm: backend
    description: "接通 Chat runtime 的三条首批 route：`openai-chat-completions`、`anthropic-messages`、`openai-responses`"
    exit: cargo test 通过
    status: done
  - id: step-8
    paradigm: backend
    description: "把 `test_channel_input` 改为 Probe Route，同真实发送共享 resolver，不再“/models + 猜 fallback”"
    exit: cargo test 通过
    status: done
  - id: step-9
    paradigm: verification
    description: "端到端验证 Chat 请求真消费、协议选路一致、Agent 三类 interrupt、旧协议仅剩 compat shim"
    exit: 手动验收
    status: done

checks:
  - id: check-canonical-shared-types
    description: "`packages/shared` 成为 Chat/Agent 协议唯一真相，不再由 `ipc.ts` 本地发明事件形状"
    target: step-2
  - id: check-chat-request-truth
    description: "Chat 已存在 UI 字段不再在 IPC 层静默丢弃；不支持字段会显式报错或被 UI 禁用"
    target: step-3
  - id: check-chat-delta-unify
    description: "Chat 流式全链路只使用 `delta`，不再 content/delta 双轨并存"
    target: step-4
  - id: check-agent-payload-unify
    description: "Agent 前端监听只接收 `AgentStreamPayload`，不再依赖 `{ kind: text|tool_use|interrupt }` 本地方言"
    target: step-5
  - id: check-interrupt-single-entry
    description: "Banner 与新调用点全部走 `respond_agent_interrupt`，旧命令仅保留 compat shim"
    target: step-5
  - id: check-chat-route-resolver
    description: "Chat runtime 与测试连接共享同一套 protocol resolver，不再分叉猜 endpoint"
    target: step-6
  - id: check-openai-responses
    description: "OpenAI Responses 已成为受支持的首批 Chat route，而不是继续硬打 `/chat/completions`"
    target: step-7
  - id: check-probe-runtime-parity
    description: "同一 provider/base URL 下，`test_channel_input` 与真实发送的协议判定结果一致"
    target: step-8
  - id: check-e2e
    description: "Chat 与 Agent 的主链路在协议层闭环，且无新增旧协议调用点"
    target: step-9
