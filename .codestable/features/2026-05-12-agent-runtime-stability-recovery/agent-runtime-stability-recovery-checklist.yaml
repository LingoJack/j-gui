feature: 2026-05-12-agent-runtime-stability-recovery
roadmap: j-gui-v1
roadmap_item: agent-runtime-stability-recovery
created: 2026-05-12
status: done

steps:
  - id: step-1
    paradigm: micro-refactor
    description: "为 Rust 侧 runtime slot 查找、插入、删除抽 helper，先做只搬不改行为的整理"
    exit: cargo test 通过
    status: done
  - id: step-2
    paradigm: data-model
    description: "让 `respond_agent_interrupt` 与 `stop_agent` 的输入显式带 `sessionId`，统一会话级路由口径"
    exit: cargo test 通过
    status: done
  - id: step-3
    paradigm: backend
    description: "把 `AgentState` 从全局单例升级为 runtime table，并让 `start/send/respond/stop` 全部按 sessionId 路由"
    exit: cargo test 通过
    status: done
  - id: step-4
    paradigm: frontend
    description: "前端 `agentChannels` 与 `stopAgent` 改成真正 per-session，不再切会话时自动强停其他会话"
    exit: bun run test 通过
    status: done
  - id: step-5
    paradigm: verification
    description: "验证 complete/error/stoppedByUser 后的 slot 清理与会话继续使用一致性"
    exit: bash scripts/check_lint.sh 通过
    status: done

checks:
  - id: check-session-routed-interrupt
    description: "interrupt 响应已按 `sessionId` 路由，不再命中全局当前实例"
    target: step-2
  - id: check-runtime-table
    description: "Rust 后端已不再使用 `Option<AgentEngine>` 单槽位模型"
    target: step-3
  - id: check-stop-routing
    description: "`stop_agent(sessionId)` 只影响目标会话"
    target: step-3
  - id: check-frontend-no-forced-stop
    description: "前端不再因切换会话自动停止其他会话的 Agent"
    target: step-4
  - id: check-recovery-surface
    description: "complete/error/用户中断后，前后端状态能一致恢复并允许继续发送"
    target: step-5
