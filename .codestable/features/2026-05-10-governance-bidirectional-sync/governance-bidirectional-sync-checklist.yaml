feature: 2026-05-10-governance-bidirectional-sync
roadmap: j-gui-v1
roadmap_item: governance-bidirectional-sync
created: 2026-05-10
status: done

steps:
  - id: step-1
    paradigm: data-model
    description: "确认 `GovernanceKernel` 与 `commands/governance.rs` 的 Skills / Hooks / MCP / workspace 命令面一致，并把 ToolSettings runtime 显式排除出本项"
    exit: cargo check 通过
    status: done
  - id: step-2
    paradigm: frontend
    description: "确认 `HooksSettings` 的启停开关与来源筛选只依赖正式后端命令"
    exit: bun run test 通过
    status: done
  - id: step-3
    paradigm: backend
    description: "确认 Skills / MCP / CC SDK 工作区治理命令的真实持久化路径，并与设计边界对齐"
    exit: 代码核对完成
    status: done
  - id: step-4
    paradigm: docs
    description: "补治理项的 acceptance 目标，只把 Skills / Hooks / MCP / workspace 治理真相作为完成标准"
    exit: acceptance 范围拍定
    status: done
  - id: step-5
    paradigm: verification
    description: "跑治理项的端到端持久化验收，确认刷新/重开后不丢状态"
    exit: 默认门禁通过 + 串行持久化验收命令通过
    status: done

checks:
  - id: check-governance-surface
    description: "治理命令面与 `GovernanceKernel` / Tauri 注册一致，ToolSettings runtime 已拆出"
    target: step-1
    status: passed
  - id: check-hooks-ui
    description: "HooksSettings 的启停与来源筛选只依赖正式命令"
    target: step-2
    status: passed
  - id: check-governance-persistence-path
    description: "Skills / MCP / CC SDK 工作区治理命令都已有真实后端实现与注册"
    target: step-3
    status: passed
  - id: check-governance-boundary
    description: "治理项的 acceptance 边界不再混入 ToolSettings runtime"
    target: step-4
    status: passed
  - id: check-persistence
    description: "Skills / MCP / Hooks 操作持久化到真实数据目录并能在重开后保留"
    target: step-5
    status: passed
