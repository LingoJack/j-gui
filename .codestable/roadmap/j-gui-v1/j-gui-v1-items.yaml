  # ===== Phase E: P0/P1 产品体验硬化 =====
  - slug: product-friction-audit
    description: 产品摩擦审计——按真实桌面使用路径盘点 UI 细节、交互摩擦、状态反馈和功能断点，形成可复现问题清单
    depends_on: [runtime-observability-gates, proma-parity-evidence-pass]
    status: done
    feature: 2026-05-12-product-friction-audit
    minimal_loop: false
    notes: 2026-05-12 完成——七个区域的产品摩擦台账、P0/P1/P2 分级和后续 roadmap 映射已落到 `.codestable/acceptance/product-friction/2026-05-12/`；当前仍缺更强截图/录屏资产，但不影响本项作为后续体验硬化的事实输入。

  - slug: core-workflow-ux-hardening
    description: 核心工作流体验硬化——收口 Chat/Agent 日常输入、停止、重试、错误提示、滚动、焦点、快捷键和恢复体验
    depends_on: [product-friction-audit]
    status: done
    feature: 2026-05-12-core-workflow-ux-hardening
    minimal_loop: false
    notes: 2026-05-12 第一批实现已完成 pf-006、pf-001、pf-016、pf-004 四条主路径 finding：最后 tab 空态、Chat 工具活动提示、Chat->Agent 迁移入口、搜索结果归档标识与细节。

  - slug: settings-experience-hardening
    description: 设置体验硬化——让 Settings 中保存、失败、unsupported、凭据、工具状态和来源提示都能被用户理解
    depends_on: [product-friction-audit, toolsettings-runtime-closure, governance-bidirectional-sync, agent-governance-surface-hardening, system-prompt-runtime-hardening, about-update-surface-refresh, environment-configuration-surface]
    status: planned
    feature: null
    minimal_loop: false
    notes: 目标不是新增更多设置项，而是把已有设置区从“能落盘”推进到“用户知道发生了什么”。

  - slug: agent-workbench-polish
    description: Agent 工作台打磨——收口 timeline、权限请求、工具调用、文件上下文、停止/继续工作和历史恢复的可读性与可操作性
    depends_on: [product-friction-audit, agent-history-replay-closure, agent-runtime-stability-recovery]
    status: planned
    feature: null
    minimal_loop: false
    notes: 聚焦 Agent 作为长期工作台的体验可信度，不重新设计 Agent runtime。

  - slug: visual-layout-polish
    description: 视觉与布局细节打磨——集中处理布局密度、溢出、按钮状态、滚动区域、文本截断、焦点态和响应式问题
    depends_on: [product-friction-audit]
    status: planned
    feature: null
    minimal_loop: false
    notes: 以审计截图和复现步骤驱动，不做全局换肤或营销式重设计。

  - slug: shortcut-system-hardening
    description: 快捷键系统硬化——修全局快捷键与缩放快捷键真 bug，消除浏览器默认行为回退，统一文案、渲染进程注册与主进程能力真相
    depends_on: [product-friction-audit, core-workflow-ux-hardening]
    status: done
    feature: null
    minimal_loop: false
    notes: 2026-05-13 完成——Ctrl/Cmd+Shift+P 已接通全局显示主窗口与前台防默认打印拦截；Ctrl/Cmd + + / - / 0 已接通 webview 缩放；Tauri ACL 显式补齐 register/unregister/show/unminimize/set-focus/set-webview-zoom，并补 capability/键位回归测试。

  - slug: sidebar-performance-hardening
    description: 侧边栏性能硬化——继续按 explore 证据拆 LeftSidebar / SessionListItems / main 壳层订阅，解决展开收起不够丝滑的结构性卡顿
    depends_on: [product-friction-audit, core-workflow-ux-hardening]
    status: planned
    feature: null
    minimal_loop: false
    notes: 当前主因仍是 mega-component 体量、atom 订阅面、折叠展开重渲染范围和同步持久化写入，不应先把问题归咎为动画曲线。

  - slug: desktop-shell-platform-polish
    description: 桌面壳层平台打磨——图标切到 J logo，并按平台收口窗口控制、titlebar 与桌面壳交互真相
    depends_on: [product-friction-audit]
    status: planned
    feature: null
    minimal_loop: false
    notes: Windows 侧重点是自定义最小化/最大化/关闭；macOS 侧重点是保留系统红绿灯与 overlay/titlebar 行为。Windows 机器不能把 macOS 效果直接视为已验证。

  - slug: agent-backend-switch-ux-hardening
    description: Agent 后端切换交互硬化——把 Claude SDK / JAgent 收口成直接、可感知、可回滚的 backend mode 切换，而不是与模型供应商设置混淆
    depends_on: [product-friction-audit, core-workflow-ux-hardening]
    status: planned
    feature: null
    minimal_loop: false
    notes: 当前 Agent 输入区里的 Claude SDK/JAgent 已对应 agentBackendMode，但用户侧仍容易误读成模型提供商设置；需补状态反馈、失败回滚、当前模式说明与禁用态真相。

  - slug: agent-governance-surface-hardening
    description: Agent 外部工具治理面硬化——增强 Skills / MCP / Hooks 的全局与工作区来源可见性、导入反馈、跨来源识别与管理体验
    depends_on: [product-friction-audit, governance-bidirectional-sync]
    status: planned
    feature: null
    minimal_loop: false
    notes: 当前虽已有 workspace/j-cli/global 多来源入口，但 discoverability、来源提示、切换反馈和 Hooks 生命周期表达仍偏弱；参考 Proma/Codex 的体验做增强，但不回退到自管平台。

  - slug: system-prompt-runtime-hardening
    description: 系统提示词运行时硬化——补默认提示词覆写/恢复默认、默认值本地化 truth，以及增强选项的真实后端消费语义
    depends_on: [product-friction-audit]
    status: planned
    feature: null
    minimal_loop: false
    notes: 当前 builtin prompt 仍只读，appendDateTimeAndUserName 只有开关和静态文案；需把“默认是否可改、怎么恢复、后端到底有没有消费”做成真实能力。

  - slug: about-update-surface-refresh
    description: 关于/更新页刷新——补齐 j-gui、内嵌 j-cli、本地 j CLI、本机 Claude Code CLI 版本、运行时、项目信息与更中性的更新状态表达
    depends_on: [product-friction-audit]
    status: planned
    feature: null
    minimal_loop: false
    notes: 当前 AboutSettings 仍偏薄；需要显式暴露“当前 Claude Code Agent 模式实际调用的本机 Claude Code CLI 版本”，并把“已是最新”从成功绿改为更中性的状态色，不照搬 Proma 的版本历史/更新中心。

  - slug: environment-configuration-surface
    description: 环境配置页——提供 Shell 显式选择、fallback 规则、推荐 shell，以及 Node/Git/Bun/Git Bash/WSL/PowerShell 的状态与失败原因
    depends_on: [product-friction-audit]
    status: planned
    feature: null
    minimal_loop: false
    notes: 需要明确区分 j-gui 本体、Claude Code CLI、npm 安装链路与 Shell tool 能力；Node 仅按安装方式/扩展工具链相关信息展示，不再作为统一硬前提。

  - slug: dogfooding-blocker-burn-down
    description: 真实使用阻塞清零——按产品摩擦审计和自开发 workflow 暴露的高频阻塞逐条收口到可日常稳定复现
    depends_on: [product-friction-audit, core-workflow-ux-hardening]
    status: planned
    feature: null
    minimal_loop: false
    notes: 不再排到远程/后端演进之后；先处理真实使用中迫使用户退回外部终端或手工补救的阻塞。

