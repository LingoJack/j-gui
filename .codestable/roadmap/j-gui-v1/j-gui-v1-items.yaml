  # ===== Phase B: P0 能力闭环 =====
  - slug: stream-protocol-unify
    description: 统一 Chat / Agent 的输入、流式事件和中断回传协议，消除字段错位与旧协议长期并存
    depends_on: [channel-model-unify, kernel-trait-abstraction]
    status: done
    feature: 2026-05-11-stream-protocol-unify
    minimal_loop: true
    notes: 覆盖 ChatSendInput 字段消费、Chat delta/content 口径、respond_agent_interrupt 统一化，并补齐 Chat runtime 协议选路、测试连接与真实发送同口径、OpenAI Responses 首批支持

  - slug: agent-history-replay-closure
