    feature: 2026-05-12-proma-parity-evidence-pass
    minimal_loop: false
    notes: 2026-05-12 完成——已建立新的 2026-05-12 parity 证据目录，显式记录输入漂移并用真实的 Pass/Partial/Fail 框架替换旧的过度乐观结论；当前完成的是证据收口，不代表所有 parity 项都已判 Pass

  - slug: tdd-coverage
    description: 测试与规约门禁升级——从“已有大量测试”升级到“能真正挡住高价值闭环回归”
    depends_on: [runtime-observability-gates]
    status: done
    feature: 2026-05-12-tdd-coverage
    minimal_loop: false
    notes: 2026-05-12 完成——已按当前代码真相翻正旧 coverage 口径，并补 chat 命令层的会话生命周期与 stop-generation 状态锚点；本项完成代表建立持续收口基线，不代表全仓命令层测试已补平

