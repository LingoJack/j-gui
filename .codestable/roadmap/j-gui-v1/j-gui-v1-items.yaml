    status: planned
    feature: null
    minimal_loop: false
    notes: 价值在于更强控制力与更少兼容层；不应先于当前闭环问题

  - slug: dogfooding-self-development-loop
    description: 自开发闭环——让 j-gui 能稳定承担“用自己开发自己”的日常工作流
    depends_on: [agent-history-replay-closure, toolsettings-runtime-closure, search-content-closure, runtime-observability-gates, proma-parity-evidence-pass]
    status: planned
    feature: null
    minimal_loop: false
    notes: “超越 Proma”的首个落点不是更多功能，而是更可靠的自使用能力

