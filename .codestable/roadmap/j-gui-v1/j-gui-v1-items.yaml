  - slug: proma-parity-evidence-pass
    description: Proma 对标证据收口——截图、录屏、验收记录与代码证据统一
    depends_on: [agent-history-replay-closure, toolsettings-runtime-closure, search-content-closure, runtime-observability-gates]
