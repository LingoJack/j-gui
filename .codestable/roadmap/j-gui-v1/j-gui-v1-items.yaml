    status: planned
    feature: null
    minimal_loop: false
    notes: 已有旧 design 与代码分支可复用，但 roadmap 先要求重新核对当前代码真相、切换成本、阻塞缺口与退出标准；不默认承诺一定切主后端

  - slug: proma-backend-capability-absorption
    description: Proma 后端能力吸收——把 explore 已证实值得迁的恢复状态机、事件语义、存储防线、环境探测与磁盘治理转成 j-gui Rust 主线
    depends_on: [runtime-observability-gates, proma-parity-evidence-pass, dogfooding-blocker-burn-down]
    status: planned
    feature: null
    minimal_loop: false
    notes: 先补 CLI backend 编排层，再决定更深的 JAgent parity；明确不 1:1 复制 Electron AgentOrchestrator，也不把 workspace/skills/MCP 自管平台整体搬回当前 runtime。

  - slug: frontend-domain-reorganization
    description: 前端领域化重组——按 shell/chat/agent/settings/bootstrap 等领域收拢 src，持续拆 main.tsx、LeftSidebar、AgentSettings 等 mega-surface
    depends_on: [sidebar-performance-hardening, desktop-shell-platform-polish, agent-governance-surface-hardening, system-prompt-runtime-hardening, about-update-surface-refresh, environment-configuration-surface]
    status: planned
    feature: null
    minimal_loop: false
    notes: 目标是根桌面应用按领域组织和订阅范围收口，不是现在先做多 crate 硬拆；后续移动端立项时再演进到 apps/desktop + apps/mobile-*。

  - slug: agent-backend-parity-hardening
    description: 双后端并存收口——backend mode、错误暴露、可观测性、回退边界与设置真相统一
    depends_on: [agent-engine-jagent, runtime-observability-gates]
    status: planned
