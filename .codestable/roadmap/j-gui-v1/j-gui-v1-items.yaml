    depends_on: [stream-protocol-unify, message-persistence]
    status: done
    feature: 2026-05-12-agent-history-replay-closure
    minimal_loop: true
    notes: 2026-05-12 完成——history replay/fork/rewind/workspace move 已补 acceptance，Phase B 联合复验通过；继续恢复 hidden context 不在本项范围内

  - slug: agent-runtime-stability-recovery
    description: Agent 运行时稳定性与恢复——超时、重试、中断、恢复后的状态一致性与可观测性
    depends_on: [stream-protocol-unify, agent-history-replay-closure]
    status: done
    feature: 2026-05-12-agent-runtime-stability-recovery
    minimal_loop: false
    notes: 2026-05-12 完成——per-session runtime table、interrupt/stop 路由、slot 清理与继续使用一致性已补 acceptance，并通过 Phase B 联合复验

