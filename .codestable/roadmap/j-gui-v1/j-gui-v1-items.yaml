    status: planned
    feature: null
    minimal_loop: false
    notes: 解决“设置页存在但后端注册/运行时行为未完全证实”的问题

  - slug: search-content-closure
    description: 搜索内容闭环——从标题搜索升级到消息内容搜索、命中预览、消息锚点打开与跨模式一致性
    depends_on: [message-persistence]
    status: planned
    feature: null
    minimal_loop: false
    notes: 当前标题搜索可用，但内容搜索仍缺稳定后端闭环证据

  - slug: session-archive
    description: 会话归档与归档视图一致性
    depends_on: [search-content-closure, agent-history-replay-closure]
    status: planned
    feature: null
    minimal_loop: false
    notes: 放在搜索与回放闭环之后推进，避免归档成为新的伪闭环入口

  # ===== Phase D: P1 质量与 Proma 证据收口 =====
  - slug: runtime-observability-gates
    description: 关键闭环的错误暴露、回归测试与验收门禁
    depends_on: [stream-protocol-unify, agent-runtime-stability-recovery, toolsettings-runtime-closure, search-content-closure]
    status: planned
    feature: null
    minimal_loop: false
    notes: 重点覆盖 Agent history replay、message-content search、ToolSettings runtime closure 三个高风险域

  - slug: proma-parity-evidence-pass
    description: Proma 对标证据收口——截图、录屏、验收记录与代码证据统一
    depends_on: [agent-history-replay-closure, toolsettings-runtime-closure, search-content-closure, runtime-observability-gates]
    status: in-progress
    feature: null
    minimal_loop: false
    notes: 保留原有证据收集方向，但以后只在关键闭环完成后再推进通过判定

  - slug: tdd-coverage
    description: 测试与规约门禁升级——从“已有大量测试”升级到“能真正挡住高价值闭环回归”
    depends_on: [runtime-observability-gates]
    status: in-progress
    feature: null
    minimal_loop: false
    notes: 旧口径过于乐观；当前改为持续收口项，重点看高价值闭环而不是总数

  # ===== Phase E: P2 自我开发闭环与超越 Proma =====
  - slug: agent-engine-jagent
    description: 评估并集成 j-agent 原生后端，减少 CLI 兼容层复杂度
