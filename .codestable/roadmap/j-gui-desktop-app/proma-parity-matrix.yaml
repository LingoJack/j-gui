items:
  - slug: proma-parity-shell-sidebar
    priority: P0
    proma_sources:
      - apps/electron/src/renderer/components/app-shell/AppShell.tsx
      - apps/electron/src/renderer/components/app-shell/LeftSidebar.tsx
      - apps/electron/src/renderer/components/app-shell/ModeSwitcher.tsx
      - apps/electron/src/renderer/components/app-shell/NavigatorPanel.tsx
      - apps/electron/src/renderer/components/app-shell/RightSidePanel.tsx
    j_gui_targets:
      - src/components/app-shell/AppShell.tsx
      - src/components/app-shell/LeftSidebar.tsx
      - src/components/app-shell/RightSidePanel.tsx
      - src/atoms/sidebar.ts
      - src/atoms/tabs.ts
    acceptance_points:
      - id: shell-mode-session-isolation
        must: Chat/Agent 模式切换、侧栏高亮、session list、active tab 不串
        evidence: screenshot_or_recording
      - id: shell-collapsed-usable
        must: 折叠态仍可新建、搜索、设置、模式切换
        evidence: screenshot_or_recording
      - id: shell-agent-working-pinned
        must: Agent Working/pinned/未查看完成状态可见
        evidence: screenshot_or_recording
      - id: shell-right-panel-session-state
        must: 右侧面板按 Agent tab/session 显隐和恢复
        evidence: screenshot_or_recording
      - id: shell-titlebar-drag
        must: titlebar drag/no-drag 区域不遮挡可点击控件
        evidence: manual_record
    exclusions:
      - 多 workspace 管理不做，但单工作区能力提示必须保留

