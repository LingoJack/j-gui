name: Desktop CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  gate:
    name: Gate (Ubuntu)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Fetch PR head ref for D11 commit check
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git fetch --no-tags --depth=1 origin \
            +refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/pr-head

      - name: Run default gate
        env:
          CHECK_COMMIT_REF: ${{ github.event_name == 'pull_request' && 'refs/remotes/origin/pr-head' || 'HEAD' }}
        run: make check-lint

  build-desktop:
    name: Build (${{ matrix.label }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux
            use_target: false
            rust_targets: ""
            tauri_args: ""
            bundle_root: src-tauri/target/release/bundle
          - os: macos-26-intel
            label: macOS-Intel
            use_target: true
            tauri_args: "--target x86_64-apple-darwin"
            rust_targets: x86_64-apple-darwin
            bundle_root: src-tauri/target/x86_64-apple-darwin/release/bundle
          - os: macos-26
            label: macOS-AppleSilicon
            use_target: true
            tauri_args: "--target aarch64-apple-darwin"
            rust_targets: aarch64-apple-darwin
            bundle_root: src-tauri/target/aarch64-apple-darwin/release/bundle
          - os: windows-latest
            label: Windows
            use_target: false
            rust_targets: ""
            tauri_args: ""
            bundle_root: src-tauri/target/release/bundle
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Rust
        if: ${{ !matrix.use_target }}
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust target
        if: ${{ matrix.use_target }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri desktop bundle
        if: ${{ !matrix.use_target }}
        run: bun run tauri build

      - name: Build Tauri desktop bundle (custom target)
        if: ${{ matrix.use_target }}
        run: bun run tauri build ${{ matrix.tauri_args }}

      - name: Package Linux snapshot tarball
        if: matrix.os == 'ubuntu-24.04'
        run: |
          rm -rf release-artifacts/linux-snapshot
          mkdir -p release-artifacts/linux-snapshot
          cp src-tauri/target/release/j-gui release-artifacts/linux-snapshot/j-gui
          tar -czf release-artifacts/j-gui-linux-snapshot-x86_64-unknown-linux-gnu.tar.gz \
            -C release-artifacts/linux-snapshot \
            j-gui

      - name: Package Windows portable zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts/windows-portable | Out-Null
          Copy-Item src-tauri/target/release/j-gui.exe release-artifacts/windows-portable/j-gui.exe
          Compress-Archive `
            -Path release-artifacts/windows-portable/* `
            -DestinationPath release-artifacts/j-gui-windows-portable-x86_64-pc-windows-msvc.zip `
            -Force

      - name: Upload Linux deb bundle
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: j-gui-linux-deb
          path: ${{ matrix.bundle_root }}/**/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux rpm bundle
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: j-gui-linux-rpm
          path: ${{ matrix.bundle_root }}/**/*.rpm
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux AppImage bundle
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: j-gui-linux-appimage
          path: ${{ matrix.bundle_root }}/**/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux snapshot bundle
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: j-gui-linux-snapshot
          path: release-artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows installer bundles
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: j-gui-windows-installers
          path: |
            ${{ matrix.bundle_root }}/**/*.msi
            ${{ matrix.bundle_root }}/**/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows portable bundle
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: j-gui-windows-portable
          path: release-artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS bundles
        if: startsWith(matrix.os, 'macos-')
        uses: actions/upload-artifact@v4
        with:
          name: j-gui-${{ matrix.label }}
          path: |
            ${{ matrix.bundle_root }}/**/*.dmg
            ${{ matrix.bundle_root }}/**/*.app.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish Release Assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t release_files < <(
            find release-assets -type f \
              \( \
                -name '*.deb' -o \
                -name '*.rpm' -o \
                -name '*.AppImage' -o \
                -name '*.dmg' -o \
                -name '*.app.tar.gz' -o \
                -name '*.msi' -o \
                -name '*.exe' -o \
                -name '*.zip' -o \
                -name '*.tar.gz' \
              \) | sort
          )

          if [[ ${#release_files[@]} -eq 0 ]]; then
            echo 'No release assets found.'
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${release_files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${release_files[@]}" --verify-tag --generate-notes
          fi

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: j-gui-release-assets-${{ github.ref_name }}
          path: release-assets/**/*
          if-no-files-found: error
          retention-days: 14
